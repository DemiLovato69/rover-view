name: Build collector
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtserialport qtsensors
          cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libproj-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
      - if: runner.os == 'macOS'
        run: brew list proj || brew install proj
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install 'proj[core,tiff]:x64-windows'
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake --install build --config Release --prefix dist
      - uses: actions/upload-artifact@v4
        with:
          name: fieldrover-${{ runner.os }}
          path: dist
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          modules: qtsensors
          extra: --autodesktop
          cache: true
      - name: Install target dependencies
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          vcpkg install 'proj[core,tiff]:arm64-android' --x-install-root="$RUNNER_TEMP/target-deps"
      - name: Build arm64 APK
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android -DVCPKG_INSTALLED_DIR="$RUNNER_TEMP/target-deps" \
            -DQT_HOST_PATH="$QT_ROOT_DIR/../gcc_64" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" -DANDROID_PLATFORM=android-28 \
            -DQT_ANDROID_DEPLOYMENT_TYPE=Debug -DBUILD_TESTING=OFF
          cmake --build build --target apk --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: fieldrover-android-arm64
          path: build/**/*.apk
          if-no-files-found: error
